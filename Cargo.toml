[workspace]
members = [
    "client",
    "crates/protocol",
    "server",
    "server/host-agent",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/00b7ce/lan-usb-bridge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
