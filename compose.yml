services:
  usb-bridge:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
    container_name: usb-bridge
    environment:
      LISTEN_ADDRESS: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-usb_bridge_server=info}
      USB_BACKEND: ${USB_BACKEND:-sysfs}
      USB_CONTROL_BACKEND: ${USB_CONTROL_BACKEND:-mock}
      USB_SYSFS_ROOT: /host/sys/bus/usb/devices
      HOST_AGENT_SOCKET: /run/lan-usb-bridge/host-agent.sock
      SELECTION_FILE: /data/selection.json
    user: "${USB_BRIDGE_UID:-1000}:${USB_BRIDGE_GID:-1000}"
    volumes:
      # USBデバイスのエントリは/sys/devicesへのsymlinkなので/sys全体が必要です。
      - /sys:/host/sys:ro
      - /run/lan-usb-bridge:/run/lan-usb-bridge:ro
      - ./data:/data
    ports:
      - "${USB_BRIDGE_BIND_ADDRESS:-127.0.0.1}:${USB_BRIDGE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/usb-bridge-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
