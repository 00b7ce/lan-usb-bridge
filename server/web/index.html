<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>USB Bridge Server</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 64rem; margin: 2rem auto; padding: 0 1rem; }
      header, .actions, .device { display: flex; gap: .75rem; align-items: center; }
      header { justify-content: space-between; }
      button { padding: .55rem .9rem; cursor: pointer; }
      fieldset { margin: 1rem 0; border: 1px solid #8886; border-radius: .5rem; }
      legend { font-weight: 700; padding: 0 .4rem; }
      .device { padding: .65rem .25rem; border-top: 1px solid #8884; }
      .device:first-of-type { border-top: 0; }
      .details { flex: 1; min-width: 0; }
      .name { font-weight: 600; }
      .meta { opacity: .75; font: .85rem ui-monospace, monospace; overflow-wrap: anywhere; }
      .warning { color: #d98200; font-size: .85rem; }
      .badge { border-radius: 999px; padding: .15rem .5rem; font-size: .75rem; }
      .normal { background: #23863633; }
      .caution { background: #d2992233; }
      #message { min-height: 1.5rem; }
      .error { color: #e5534b; }
      @media (max-width: 40rem) { header { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>USB Bridge</h1>
        <p>転送対象にするUSBデバイスを選択します。USBハブはグループとしてのみ表示されます。</p>
      </div>
      <button id="reload" type="button">再検出</button>
    </header>
    <div id="message" role="status"></div>
    <main id="devices">読み込み中...</main>
    <div class="actions">
      <button id="save" type="button">選択を保存</button>
      <span id="count"></span>
    </div>

    <script>
      const container = document.querySelector('#devices');
      const message = document.querySelector('#message');
      const count = document.querySelector('#count');
      let devices = [];

      function displayName(device) {
        return device.product || device.manufacturer || `USB ${device.vendor_id}:${device.product_id}`;
      }

      function updateCount() {
        const selected = document.querySelectorAll('input.device-select:checked').length;
        count.textContent = `${selected}個選択中`;
      }

      function render() {
        container.replaceChildren();
        const groups = new Map();
        for (const device of devices) {
          const key = device.parent_hub || 'direct';
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(device);
        }
        for (const [parent, children] of groups) {
          const fieldset = document.createElement('fieldset');
          const legend = document.createElement('legend');
          const groupToggle = document.createElement('input');
          groupToggle.type = 'checkbox';
          groupToggle.checked = children.filter(d => d.selectable).every(d => d.selected);
          groupToggle.indeterminate = !groupToggle.checked && children.some(d => d.selected);
          groupToggle.addEventListener('change', () => {
            fieldset.querySelectorAll('input.device-select:not(:disabled)')
              .forEach(input => { input.checked = groupToggle.checked; });
            updateCount();
          });
          legend.append(groupToggle, ` USB接続グループ ${parent}`);
          fieldset.append(legend);

          for (const device of children) {
            const row = document.createElement('label');
            row.className = 'device';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'device-select';
            checkbox.value = device.bus_id;
            checkbox.checked = device.selected;
            checkbox.disabled = !device.selectable;
            checkbox.addEventListener('change', updateCount);

            const details = document.createElement('span');
            details.className = 'details';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = displayName(device);
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `${device.vendor_id}:${device.product_id} · ${device.bus_id} · ${device.drivers.join(', ') || 'driverなし'}`;
            details.append(name, meta);
            if (device.warning) {
              const warning = document.createElement('div');
              warning.className = 'warning';
              warning.textContent = device.warning;
              details.append(warning);
            }
            const badge = document.createElement('span');
            badge.className = `badge ${device.risk}`;
            badge.textContent = device.risk === 'normal' ? '通常' : '注意';
            row.append(checkbox, details, badge);
            fieldset.append(row);
          }
          container.append(fieldset);
        }
        if (!devices.length) container.textContent = 'USBハブ以外のデバイスが見つかりませんでした。';
        updateCount();
      }

      async function loadDevices() {
        message.textContent = 'USBデバイスを検出しています...';
        message.className = '';
        try {
          const response = await fetch('/api/devices');
          if (!response.ok) throw new Error((await response.json()).error || response.statusText);
          devices = await response.json();
          render();
          message.textContent = `${devices.length}個のUSBデバイスを検出しました。`;
        } catch (error) {
          message.textContent = `検出に失敗しました: ${error.message}`;
          message.className = 'error';
        }
      }

      async function saveSelection() {
        const selected = [...document.querySelectorAll('input.device-select:checked')]
          .map(input => input.value);
        message.textContent = '保存しています...';
        message.className = '';
        try {
          const response = await fetch('/api/selection', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ devices: selected }),
          });
          if (!response.ok) throw new Error((await response.json()).error || response.statusText);
          devices.forEach(device => { device.selected = selected.includes(device.bus_id); });
          message.textContent = '選択を保存しました。USBの接続状態は変更していません。';
        } catch (error) {
          message.textContent = `保存に失敗しました: ${error.message}`;
          message.className = 'error';
        }
      }

      document.querySelector('#reload').addEventListener('click', loadDevices);
      document.querySelector('#save').addEventListener('click', saveSelection);
      loadDevices();
    </script>
  </body>
</html>
